name: Firmware CI

# configure to include the smart switch in the future

on:
  push:
    paths:
      - 'firmware/rail_bot/**'
      - '.github/workflows/firmware-ci.yml'

  pull_request:
    paths:
      - 'firmware/rail_bot/**'
      - '.github/workflows/firmware-ci.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ESP32-C3 Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1.1
          target: esp32c3
          path: 'firmware/rail-bot'
          
      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32c3-firmware-${{ github.sha }}
          path: |
            firmware/rail-bot/build/*.bin
            firmware/rail-bot/build/*.elf
            firmware/rail-bot/build/*.map
          if-no-files-found: error
          retention-days: 14